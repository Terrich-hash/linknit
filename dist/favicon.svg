<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#0f172a" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#grad)" stroke-width="3" filter="url(#glow)" />
  <!-- Cat Ears outline -->
  <path d="M 32 32 L 25 18 L 40 25 Z" fill="#ffffff" />
  <path d="M 68 32 L 75 18 L 60 25 Z" fill="#ffffff" />
  <!-- Link / Infinity Knot -->
  <path d="M 35 52 C 35 44, 45 44, 50 52 C 55 60, 65 60, 65 52 C 65 44, 55 44, 50 52 C 45 60, 35 60, 35 52 Z" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Blush Dots -->
  <circle cx="33" cy="58" r="3" fill="#f43f5e" opacity="0.8" />
  <circle cx="67" cy="58" r="3" fill="#f43f5e" opacity="0.8" />
</svg>
